[package]
name = "luna-sdk"
version = "0.1.0"
edition = "2024"
description = "Write Luna plugins in Rust"

[lib]
name = "luna"

[dependencies]
ciborium = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
tower = "0.5"
