id = "dev.test.live"
version = "0.1.0"
api = "1"

[capsule]
runtime = "node-22"
entry = "main.ts"

[permissions]
events = ["twitch.channel.follow"]
chat = ["send"]
store = true

[cli]
name = "live"

[[cli.commands]]
name = "count"
summary = "follows seen"

[config]
greeting = { type = "str", default = "Welcome" }
