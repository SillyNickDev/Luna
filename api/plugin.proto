// Luna plugin API, version 1. A capsule reaches it on $CAPSULE_HOST (a Unix socket);
// every call is checked against the plugin's [permissions] in plugin.toml.
// Within API version 1 changes are additive only.
syntax = "proto3";

package luna.plugin.v1;

option go_package = "luna/internal/plugin/pb";

service Host {
  // Hello is the first call. It states the API version the plugin speaks and
  // returns its identity and effective config.
  rpc Hello(HelloRequest) returns (HelloReply);
  // Subscribe streams bus events whose type matches one of the patterns
  // ("twitch.follow" or "twitch.*"). Patterns outside [permissions].events are refused.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  // Commands carries CLI and chat commands to the plugin; the plugin answers each
  // on the same stream, matched by id.
  rpc Commands(stream CommandResult) returns (stream Command);

  rpc ChatSend(ChatSendRequest) returns (Empty);
  // Mod takes a moderation action as the channel; needs the action in [permissions].mod.
  rpc Mod(ModRequest) returns (Empty);
  // Twitch reads public channel facts and, with their own permissions, changes the channel;
  // see TwitchRequest. Not found answers data_json "null".
  rpc Twitch(TwitchRequest) returns (TwitchReply);
  // Viewer is Luna's shared profile of a chatter; needs viewers = true.
  rpc Viewer(ViewerRequest) returns (ViewerReply);
  rpc StoreGet(StoreKey) returns (StoreValue);
  rpc StoreSet(StoreSetRequest) returns (Empty);
  rpc StoreDelete(StoreKey) returns (Empty);
  rpc StoreIncr(StoreIncrRequest) returns (StoreIncrReply);
  rpc StoreKeys(StoreKeysRequest) returns (StoreKeysReply);
  // StoreBatch applies its sets and deletes atomically.
  rpc StoreBatch(StoreBatchRequest) returns (Empty);
  rpc Log(LogRequest) returns (Empty);
  // Emit publishes plugin.<id>.<name> on the bus.
  rpc Emit(EmitRequest) returns (Empty);
  // Osc talks to VRChat; needs [permissions].osc ("send:<address pattern>", "chatbox", "read").
  rpc Osc(OscRequest) returns (OscReply);
  // Hr is the latest heart rate and recent history; needs hr.update in [permissions].events.
  rpc Hr(HrRequest) returns (HrReply);
}

message Empty {}

message HelloRequest {
  string api = 1; // "1"
  string sdk = 2; // e.g. "luna-python/0.1.0", for logs
}

message HelloReply {
  string id = 1;
  bytes config_json = 2; // the plugin's [config] with the user's overrides applied
  bool dev = 3;          // running under luna capsule dev: chat never reaches Twitch
}

message SubscribeRequest {
  repeated string types = 1;
}

// Event is the bus envelope; data_json is the payload object.
message Event {
  string id = 1;
  string type = 2;
  string source = 3;
  int64 ts_ms = 4;
  bool simulated = 5;
  bytes data_json = 6;
}

message Command {
  uint64 id = 1;
  string kind = 2;      // "cli" or "chat"
  string name = 3;      // command name as declared in plugin.toml
  bytes args_json = 4;  // object of arg and flag values, already validated by Luna
  Event event = 5;      // chat commands: the chat message that invoked it
}

message CommandResult {
  uint64 id = 1;
  bytes data_json = 2; // structured result; Luna renders it as a table or JSON
  string text = 3;     // or plain text
  string error = 4;    // non-empty when the command failed
}

message ChatSendRequest {
  string text = 1;
  bool simulated = 2;  // replying to a simulated event: goes to the terminal, not Twitch
  string reply_to = 3; // message_id of the chat message being answered, if any
  string mode = 4;     // "" (a chat message), "announce" or "whisper"; each needs its name in [permissions].chat
  string to_user_id = 5; // whisper: who receives it
}

message ModRequest {
  string action = 1;     // timeout, ban, unban, delete, warn, shield, shoutout
  string user_id = 2;    // the viewer acted on (shoutout: the channel)
  int64 seconds = 3;     // timeout length
  string reason = 4;
  string message_id = 5; // delete
  bool on = 6;           // shield
  bool simulated = 7;    // acting on a simulated event: printed, never sent
}

message TwitchRequest {
  // Reads ("read"): user (by login or id), channel, stream (empty user = this channel), follow (user id),
  // categories {query}, schedule, streams {logins}. Writes, each its own permission: set_channel {title, game_id}
  // ("edit"), clip ("clips"), marker {description} ("markers"), ads and snooze ("ads"), raid {to_id} and unraid ("raid").
  string call = 1;
  string user = 2;
  bytes args_json = 3;
  bool simulated = 4; // a write answering a simulated event: printed, never sent
}

message TwitchReply {
  bytes data_json = 1;
}

message ViewerRequest {
  string user = 1; // Twitch user id, or login
}

message ViewerReply {
  bytes data_json = 1; // null when Luna hasn't seen them
}

message StoreBatchRequest {
  repeated StoreSetRequest set = 1;
  repeated string delete = 2;
}

message StoreKey {
  string key = 1;
}

message StoreValue {
  bool found = 1;
  bytes value_json = 2;
}

message StoreSetRequest {
  string key = 1;
  bytes value_json = 2;
  int64 ttl_ms = 3; // 0 = no expiry
}

message StoreIncrRequest {
  string key = 1;
  int64 by = 2;
}

message StoreIncrReply {
  int64 value = 1;
}

message StoreKeysRequest {
  string prefix = 1;
}

message StoreKeysReply {
  repeated string keys = 1;
}

message LogRequest {
  string level = 1; // debug, info, warn, error
  string msg = 2;
}

message EmitRequest {
  string name = 1;
  bytes data_json = 2;
}

message OscRequest {
  string action = 1;    // send, chatbox, param, avatar
  string address = 2;   // send: e.g. /avatar/parameters/Ears
  bytes value_json = 3; // send: true, 3, 0.5 or "text"
  string type = 4;      // send: bool, int, float or string; empty guesses from the avatar, then the value
  string text = 5;      // chatbox
  string name = 6;      // param
  bool simulated = 7;   // answering a simulated event: printed, never sent
}

message OscReply {
  bytes data_json = 1; // param: the value or null; avatar: {id, name, params}
}

message HrRequest {
  int32 minutes = 1; // history to return, up to 60
}

message HrReply {
  int32 bpm = 1;  // 0 before the first reading
  int64 at_ms = 2;
  repeated HrSample history = 3;
}

message HrSample {
  int64 at_ms = 1;
  int32 bpm = 2;
}
